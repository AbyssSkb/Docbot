[project]
name = "docbot"
version = "0.1.0"
description = "An AI-powered document assistant with multi-model retrieval system"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "faiss-cpu>=1.9.0.post1",
    "jieba>=0.42.1",
    "langchain-text-splitters>=0.3.4",
    "markitdown>=0.0.1a3",
    "openai>=1.58.1",
    "pdfplumber>=0.11.4",
    "python-dotenv>=1.0.1",
    "rank-bm25>=0.2.2",
    "streamlit>=1.41.1",
    "torch>=2.5.1",
    "tqdm>=4.67.1",
    "transformers>=4.47.1",
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu124", marker = "platform_system != 'Darwin'" },
]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true
